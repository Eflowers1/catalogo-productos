<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de productos</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --accent: #2563eb; --danger: #dc2626; --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b22; --text: #e8eaf0; --muted: #9aa3b2;
      --accent: #60a5fa; --danger: #f87171; --border: #2a2f3a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card: #181b22; --text: #e8eaf0; --muted: #9aa3b2;
    --accent: #60a5fa; --danger: #f87171; --border: #2a2f3a;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .muted { color: var(--muted); font-size: .9rem; }
  input, textarea, button { font: inherit; }
  input, textarea {
    width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text);
  }
  button {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card img { width: 100%; height: 160px; object-fit: cover; background: var(--border); }
  .card .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .precio { font-weight: 700; font-size: 1.1rem; }
  .admin {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; margin-top: 24px; display: none;
  }
  .admin.open { display: block; }
  .admin h2 { font-size: 1.2rem; margin-top: 0; }
  form.prod { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  form.prod .full { grid-column: 1 / -1; }
  form.prod .acciones { grid-column: 1 / -1; display: flex; gap: 8px; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  #msg { min-height: 1.2em; font-size: .9rem; color: var(--muted); margin: 8px 0; }
  @media (max-width: 600px) { form.prod { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Catálogo de productos</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input id="buscar" placeholder="Buscar producto…" style="width:220px;">
      <button id="btn-admin">Administrar</button>
    </div>
  </header>

  <div id="msg"></div>
  <section id="grid" class="grid"></section>

  <section id="admin" class="admin">
    <h2 id="f-titulo">Nuevo producto</h2>
    <form id="form" class="prod">
      <input type="hidden" id="f-id">
      <div class="full"><input id="f-nombre" placeholder="Nombre" required></div>
      <div class="full"><textarea id="f-descripcion" rows="3" placeholder="Descripción"></textarea></div>
      <input id="f-precio" type="number" min="0" step="0.01" placeholder="Precio" required>
      <input id="f-stock" type="number" min="0" step="1" placeholder="Stock">
      <div class="full"><input id="f-imagen" type="url" placeholder="URL de imagen (https://…)"></div>
      <div class="acciones">
        <button class="primary" type="submit">Guardar</button>
        <button type="button" id="f-cancelar">Limpiar</button>
      </div>
    </form>
    <div id="admin-lista"></div>
  </section>
</div>

<script>
  // ====== CONFIGURACIÓN ======
  // Pega aquí la URL del Web App de Apps Script (termina en /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbz7jsNiNl5Mn1bPOQKkegkqOhXnWffAAqP-_7QokVyn4kkM_tJSxkSgQ9_HSXNcpAgG9Q/exec';
  const MONEDA = 'MXN';
  const LOCALE = 'es-MX';
  // ===========================

  let productos = [];
  let adminAbierto = false;
  let token = sessionStorage.getItem('token') || '';

  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
  const fmt = (n) => new Intl.NumberFormat(LOCALE, { style: 'currency', currency: MONEDA }).format(n);

  function msg(texto, error = false) {
    const el = $('#msg');
    el.textContent = texto;
    el.style.color = error ? 'var(--danger)' : 'var(--muted)';
  }

  async function api(metodo, payload) {
    if (API_URL.startsWith('PEGAR')) throw new Error('Falta configurar API_URL en index.html');
    if (metodo === 'GET') {
      const r = await fetch(API_URL + '?action=listar');
      return r.json();
    }
    // text/plain evita el preflight de CORS que Apps Script no soporta
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ ...payload, token })
    });
    return r.json();
  }

  async function cargar() {
    msg('Cargando productos…');
    try {
      const res = await api('GET');
      if (!res.ok) throw new Error(res.error);
      productos = res.data;
      render();
      msg('');
    } catch (e) {
      msg('No se pudieron cargar los productos: ' + e.message, true);
    }
  }

  function render() {
    const q = $('#buscar').value.trim().toLowerCase();
    const lista = productos.filter(p => (p.nombre + ' ' + p.descripcion).toLowerCase().includes(q));
    $('#grid').innerHTML = lista.map(p => `
      <article class="card">
        ${p.imagen ? `<img src="${esc(p.imagen)}" alt="${esc(p.nombre)}" loading="lazy">` : ''}
        <div class="body">
          <strong>${esc(p.nombre)}</strong>
          <span class="muted">${esc(p.descripcion)}</span>
          <span class="precio">${fmt(p.precio)}</span>
          <span class="muted">${p.stock > 0 ? 'Disponibles: ' + esc(p.stock) : 'Agotado'}</span>
        </div>
      </article>`).join('') || '<p class="muted">No hay productos que mostrar.</p>';
    if (adminAbierto) renderAdmin();
  }

  function renderAdmin() {
    $('#admin-lista').innerHTML = productos.map(p => `
      <div class="fila">
        <span>${esc(p.nombre)} <span class="muted">· ${fmt(p.precio)} · stock ${esc(p.stock)}</span></span>
        <span style="display:flex; gap:6px;">
          <button data-editar="${esc(p.id)}">Editar</button>
          <button class="danger" data-borrar="${esc(p.id)}">Quitar</button>
        </span>
      </div>`).join('') || '<p class="muted">Sin productos.</p>';
  }

  function toggleAdmin() {
    if (!token) {
      const t = prompt('Clave de administración:');
      if (!t) return;
      token = t.trim();
      sessionStorage.setItem('token', token);
    }
    adminAbierto = !adminAbierto;
    $('#admin').classList.toggle('open', adminAbierto);
    if (adminAbierto) renderAdmin();
  }

  function limpiarForm() {
    $('#f-id').value = '';
    ['nombre', 'descripcion', 'precio', 'stock', 'imagen'].forEach(c => $('#f-' + c).value = '');
    $('#f-titulo').textContent = 'Nuevo producto';
  }

  function editar(id) {
    const p = productos.find(x => x.id === id);
    if (!p) return;
    $('#f-id').value = p.id;
    $('#f-nombre').value = p.nombre;
    $('#f-descripcion').value = p.descripcion;
    $('#f-precio').value = p.precio;
    $('#f-stock').value = p.stock;
    $('#f-imagen').value = p.imagen;
    $('#f-titulo').textContent = 'Editando: ' + p.nombre;
    $('#form').scrollIntoView({ behavior: 'smooth' });
  }

  async function ejecutar(action, extra) {
    msg('Guardando…');
    try {
      const res = await api('POST', { action, ...extra });
      if (!res.ok) {
        if (res.error === 'No autorizado') {
          token = '';
          sessionStorage.removeItem('token');
        }
        throw new Error(res.error);
      }
      await cargar();
      msg('Listo ✔');
    } catch (e) {
      msg('Error: ' + e.message, true);
    }
  }

  async function guardar(ev) {
    ev.preventDefault();
    const producto = {
      nombre: $('#f-nombre').value.trim(),
      descripcion: $('#f-descripcion').value.trim(),
      precio: Number($('#f-precio').value),
      stock: Number($('#f-stock').value || 0),
      imagen: $('#f-imagen').value.trim()
    };
    const id = $('#f-id').value;
    if (id) producto.id = id;
    await ejecutar(id ? 'actualizar' : 'agregar', { producto });
    limpiarForm();
  }

  async function quitar(id) {
    const p = productos.find(x => x.id === id);
    if (!p || !confirm(`¿Quitar "${p.nombre}" del catálogo?`)) return;
    await ejecutar('borrar', { id });
  }

  // ====== EVENTOS ======
  $('#buscar').addEventListener('input', render);
  $('#btn-admin').addEventListener('click', toggleAdmin);
  $('#form').addEventListener('submit', guardar);
  $('#f-cancelar').addEventListener('click', limpiarForm);
  $('#admin-lista').addEventListener('click', (ev) => {
    const ed = ev.target.dataset.editar;
    const bo = ev.target.dataset.borrar;
    if (ed) editar(ed);
    if (bo) quitar(bo);
  });

  cargar();
</script>
</body>
</html>
